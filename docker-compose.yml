services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: panitia-akhir-zaman:latest
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-2005}:80"
    volumes:
      - app-storage:/var/www/html/storage/app
      - app-framework:/var/www/html/storage/framework
      - app-logs:/var/www/html/storage/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  queue:
    image: panitia-akhir-zaman:latest
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      [
        "php",
        "artisan",
        "queue:work",
        "--sleep=3",
        "--tries=3",
        "--timeout=120",
        "--max-time=3600",
      ]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage/app
      - app-framework:/var/www/html/storage/framework
      - app-logs:/var/www/html/storage/logs

  scheduler:
    image: panitia-akhir-zaman:latest
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage/app
      - app-framework:/var/www/html/storage/framework
      - app-logs:/var/www/html/storage/logs

volumes:
  app-storage:
  app-framework:
  app-logs:
